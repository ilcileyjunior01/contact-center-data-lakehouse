name: CI — Contact Center Data Lakehouse

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Validação de sintaxe Python (sem dependências, ~30 segundos)
  # Verifica todos os .py do projeto com py_compile — detecta erros de
  # sintaxe mesmo nos jobs que importam awsglue (não disponível no CI).
  # ─────────────────────────────────────────────────────────────────────────────
  syntax-check:
    name: Syntax Check (py_compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Validate syntax — Pipeline Bronze→Silver (18 jobs)
        run: |
          echo "Verificando sintaxe dos jobs Bronze→Silver..."
          find src/bronze_to_silver -name "*.py" | sort | while read f; do
            python -m py_compile "$f" && echo "  OK: $f" || { echo "  FALHA: $f"; exit 1; }
          done
          echo "Bronze→Silver: todos OK"

      - name: Validate syntax — Pipeline Silver→Gold (22 jobs)
        run: |
          echo "Verificando sintaxe dos jobs Silver→Gold..."
          find src/silver_to_gold -name "*.py" | sort | while read f; do
            python -m py_compile "$f" && echo "  OK: $f" || { echo "  FALHA: $f"; exit 1; }
          done
          echo "Silver→Gold: todos OK"

      - name: Validate syntax — Infrastructure scripts
        run: |
          echo "Verificando sintaxe dos scripts de infraestrutura..."
          find infrastructure -name "*.py" | sort | while read f; do
            python -m py_compile "$f" && echo "  OK: $f" || { echo "  FALHA: $f"; exit 1; }
          done
          echo "Infrastructure: todos OK"

      - name: Validate syntax — Lambda functions
        run: |
          echo "Verificando sintaxe das Lambdas..."
          find lambda -name "*.py" | sort | while read f; do
            python -m py_compile "$f" && echo "  OK: $f" || { echo "  FALHA: $f"; exit 1; }
          done
          echo "Lambda: todos OK"

      - name: Validate syntax — Tests
        run: |
          echo "Verificando sintaxe dos testes..."
          find tests -name "*.py" | sort | while read f; do
            python -m py_compile "$f" && echo "  OK: $f" || { echo "  FALHA: $f"; exit 1; }
          done
          echo "Tests: todos OK"

      - name: Validate syntax — DAGs Airflow
        run: |
          echo "Verificando sintaxe das DAGs..."
          find dags -name "*.py" | sort | while read f; do
            python -m py_compile "$f" && echo "  OK: $f" || { echo "  FALHA: $f"; exit 1; }
          done
          echo "DAGs: todos OK"

      - name: Summary
        run: |
          TOTAL=$(find pipeline infrastructure lambda tests dags -name "*.py" | wc -l)
          echo "Total de arquivos Python verificados: $TOTAL"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Linting com flake8
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install flake8
        run: pip install flake8 flake8-bugbear

      - name: Run flake8 — Pipeline
        run: |
          flake8 src/ \
            --config=.flake8 \
            --format="%(path)s:%(row)d:%(col)d: %(code)s %(text)s" \
            --statistics

      - name: Run flake8 — Infrastructure
        run: |
          flake8 infrastructure/ \
            --config=.flake8 \
            --format="%(path)s:%(row)d:%(col)d: %(code)s %(text)s" \
            --statistics

      - name: Run flake8 — Tests
        run: |
          flake8 tests/ \
            --config=.flake8 \
            --format="%(path)s:%(row)d:%(col)d: %(code)s %(text)s" \
            --statistics

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Validação dos arquivos SQL (KPIs)
  # ─────────────────────────────────────────────────────────────────────────────
  sql-validate:
    name: SQL Validation (12 KPIs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install sqlfluff
        run: pip install sqlfluff==3.0.7

      - name: Validate SQL KPI files — estrutura básica
        run: |
          echo "Verificando arquivos SQL..."
          SQL_DIR="sql/athena_kpis"
          EXPECTED=12
          FOUND=$(find "$SQL_DIR" -name "*.sql" | wc -l)

          if [ "$FOUND" -ne "$EXPECTED" ]; then
            echo "ERRO: esperados $EXPECTED arquivos SQL, encontrados $FOUND"
            exit 1
          fi
          echo "Contagem OK: $FOUND arquivos SQL encontrados"

          # Verifica que cada arquivo tem conteúdo relevante
          find "$SQL_DIR" -name "*.sql" | sort | while read f; do
            SIZE=$(wc -c < "$f")
            if [ "$SIZE" -lt 100 ]; then
              echo "ERRO: $f parece vazio ou incompleto ($SIZE bytes)"
              exit 1
            fi

            # Verifica estrutura mínima esperada: FROM db_gold e SELECT
            if ! grep -qi "SELECT" "$f"; then
              echo "ERRO: $f não contém SELECT"
              exit 1
            fi
            if ! grep -qi "db_gold\." "$f"; then
              echo "ERRO: $f não referencia db_gold"
              exit 1
            fi
            echo "  OK: $f ($SIZE bytes)"
          done

      - name: Lint SQL with sqlfluff
        run: |
          sqlfluff lint sql/athena_kpis/ \
            --dialect ansi \
            --rules LT01,LT02,LT03,LT04,LT05,LT06,LT07,LT08,LT09,LT10,LT11,LT12 \
            --templater raw \
            --ignore parsing \
            || true
          # --ignore parsing: Athena usa extensões SQL não cobertas pelo ANSI
          # || true: lint warnings não quebram o CI (apenas errors fariam)
          echo "SQL lint concluído"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Testes unitários com PySpark local
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (pytest + PySpark)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11 (obrigatório para PySpark)
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pyspark==3.5.1 \
            pytest==8.2.1 \
            pytest-cov==5.0.0 \
            pytest-timeout==2.3.1

      - name: Run tests with coverage
        env:
          PYSPARK_PYTHON: python3
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          pytest tests/ \
            -v \
            --timeout=120 \
            --tb=short \
            --cov=tests \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -p no:warnings

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Validação de arquivos de configuração (IAM policies, JSON)
  # ─────────────────────────────────────────────────────────────────────────────
  config-validate:
    name: Config Validation (JSON / IAM Policies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Validate JSON files
        run: |
          echo "Validando arquivos JSON..."
          find . -name "*.json" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" | sort | while read f; do
            python -c "
          import json, sys
          try:
              json.load(open('$f'))
              print('  OK:', '$f')
          except json.JSONDecodeError as e:
              print('  FALHA:', '$f', '-', str(e))
              sys.exit(1)
          "
          done
          echo "Todos os JSON válidos"

      - name: Validate IAM policy structure
        run: |
          python - <<'EOF'
          import json, sys, glob

          policies = glob.glob("infrastructure/**/iam_*.json", recursive=True)
          print(f"IAM policies encontradas: {len(policies)}")

          for path in policies:
              with open(path) as f:
                  doc = json.load(f)

              assert "Version" in doc, f"{path}: campo 'Version' ausente"
              assert "Statement" in doc, f"{path}: campo 'Statement' ausente"
              assert isinstance(doc["Statement"], list), f"{path}: Statement deve ser lista"
              assert len(doc["Statement"]) > 0, f"{path}: Statement vazio"

              for i, stmt in enumerate(doc["Statement"]):
                  assert "Effect" in stmt, f"{path}: Statement[{i}] sem 'Effect'"
                  assert "Action" in stmt, f"{path}: Statement[{i}] sem 'Action'"
                  assert stmt["Effect"] in ("Allow", "Deny"), \
                      f"{path}: Effect inválido: {stmt['Effect']}"

              print(f"  OK: {path} ({len(doc['Statement'])} statements)")

          print("Todas as IAM policies válidas")
          EOF

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6: Validação das DAGs Airflow (sintaxe + estrutura sem servidor)
  # ─────────────────────────────────────────────────────────────────────────────
  dag-validate:
    name: DAG Validation (Airflow)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install Airflow + providers
        run: |
          pip install --upgrade pip
          pip install \
            "apache-airflow==2.9.3" \
            "apache-airflow-providers-amazon==8.21.0" \
            pytest==8.2.1 \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.9.txt"

      - name: Run DAG tests
        env:
          AIRFLOW__CORE__UNIT_TEST_MODE: "True"
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:///:memory:"
          AIRFLOW_HOME: /tmp/airflow_test
        run: |
          airflow db migrate
          pytest tests/test_dags.py -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 7: Status final — agrega todos os jobs
  # ─────────────────────────────────────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [syntax-check, lint, sql-validate, unit-tests, config-validate, dag-validate]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "syntax-check  : ${{ needs.syntax-check.result }}"
          echo "lint          : ${{ needs.lint.result }}"
          echo "sql-validate  : ${{ needs.sql-validate.result }}"
          echo "unit-tests    : ${{ needs.unit-tests.result }}"
          echo "config-validate: ${{ needs.config-validate.result }}"
          echo "dag-validate  : ${{ needs.dag-validate.result }}"

          if [[ "${{ needs.syntax-check.result }}"    != "success" ]] || \
             [[ "${{ needs.lint.result }}"             != "success" ]] || \
             [[ "${{ needs.sql-validate.result }}"     != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}"       != "success" ]] || \
             [[ "${{ needs.config-validate.result }}"  != "success" ]] || \
             [[ "${{ needs.dag-validate.result }}"     != "success" ]]; then
            echo "CI FALHOU — um ou mais jobs nao passaram"
            exit 1
          fi
          echo "CI OK — todos os checks passaram"
